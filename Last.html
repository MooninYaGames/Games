setInterval(()=>{if(!enabled||!acx)return;if(mode==='cinematic'){if(acx.currentTime>=nextBeat){let ch=chords[Math.floor(beat/4)%4],b=beat%4;tone(ch[0]*(b===2?1.5:1),.40,.06,'triangle');if(b===0||b===2)ch.slice(1).forEach((f,i)=>tone(f,1.2,.016,'sine',.04+i*.025));if(b===1||b===3)tone(ch[2+(Math.floor(beat/2)%3)]*2,.42,.023,'triangle',.12);beat++;nextBeat=acx.currentTime+.54}return}if(active||mode==='dialog'||mode==='pachinko'){let vol=mode==='dialog'?.48:1;if(Math.random()<.82){let f=800+Math.random()*1800;tone(f,.04,.013*vol,'triangle',0,f*.77);if(Math.random()<.3)for(let i=1;i<4;i++)tone(600+Math.random()*1800,.04,.009*vol,'sine',i*.035)}if(Math.random()<.055){tone(1450,.20,.014*vol,'sine');tone(2180,.15,.009*vol,'sine',.03)}if(Math.random()<.035&&acx.currentTime-lastMurmur>1.5){lastMurmur=acx.currentTime;let f=85+Math.random()*50;for(let i=0;i<4;i++)tone(f*(.9+Math.random()*.22),.13,.004*vol,'triangle',i*.13)}}},110);
updateHUD();title();requestAnimationFrame(frame);
