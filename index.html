    .step-index{display:grid;place-items:center;background:#1b646c;color:#e1fbfb;border-radius:9px;width:27px;height:27px;font-size:.78rem;font-weight:950;margin-bottom:8px}
    .nf-rule-gallery{display:grid;grid-template-columns:1fr;gap:9px}
    .nf-rule-example{border:1px solid #3b7983;border-radius:12px;background:#0e313f;display:grid;grid-template-columns:minmax(160px,1fr) 1fr;gap:13px;align-items:center;padding:12px}
    .nf-rule-visual{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:6px}
    .rule-visual-die{width:39px;height:39px;flex:0 0 39px;border:1px solid #aeede5;border-radius:8px;background:linear-gradient(135deg,#f6fffe,#cdeee9);box-shadow:0 3px 0 #46848b,0 6px 10px #00161c55;padding:7px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;place-items:center}
    .rule-visual-die i{width:6px;height:6px;border-radius:50%;background:transparent}
    .rule-visual-die i.on{background:#115f6a;box-shadow:inset 0 1px 2px #052d35}
    .nf-rule-explain b{display:block;color:#eafffd;font-size:.92rem}
    .nf-rule-explain p{font-size:.75rem;margin:4px 0 5px;line-height:1.35}
    .nf-rule-explain strong{font-size:.84rem;color:#90f3ed}
    .nf-rule-example.harm .nf-rule-explain strong{color:#ff8b9a}
    .nf-rule-example.prize{border-color:#c6b86b6e}
    .nf-rule-example.prize .nf-rule-explain strong{color:#f1d999}
    .nf-rule-footnote{font-size:.77rem;margin:11px 0 18px}
    .hp-drain-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .hp-drain-row span{background:#0e303f;border:1px solid #337681;border-radius:9px;text-align:center;padding:10px 6px;font-size:.7rem;color:#b6dadd}
    .hp-drain-row b{display:block;color:#fa849b;margin-top:5px}
    .nf-box-explain{display:flex;align-items:center;gap:15px;padding:12px 14px;border:1px solid #568e8e;border-radius:11px;background:linear-gradient(120deg,#143d4c,#123241)}
    .nf-box-explain p{font-size:.78rem;margin:0}
    .nf-box-icon{font-size:2.5rem;color:#e8d38a;line-height:1}
    .special-icon.illustrated-special{border:1px solid #81ddce;background:linear-gradient(130deg,#235d69,#0d3e4e);font-size:1.5rem;box-shadow:0 3px 0 #06404a}
    @media(max-width:760px){
      .header-inner{min-height:56px;padding:0 14px}
      .shell{padding-top:12px}
      .nf-details-grid{grid-template-columns:1fr}
      .hero{min-height:0}
      .nf-stats{gap:7px}
      .nf-stat{padding:9px 10px;min-height:56px}
      .nf-stat strong{font-size:1.45rem}
    }
    @media(max-width:650px){
      .site-header{height:51px;position:relative}
      .site-header .header-inner{height:51px;min-height:51px;display:flex;flex-wrap:nowrap;padding:0 13px}
      .header-inner .brand{height:100%}
      .game-back-link{margin-bottom:7px;font-size:.72rem}
      .nf-head{margin-top:0;gap:6px;margin-bottom:8px}
      .nf-head .game-name{font-size:1.18rem}
      .nf-head .game-mark{display:none}
      .nf-head .game-head-actions{gap:4px}
      .nf-head .game-head-actions .btn{font-size:.68rem;padding:6px 8px;min-height:29px}
      .nf-stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:7px}
      .nf-stat{padding:7px 6px;min-height:55px;align-items:flex-start;border-radius:9px}
      .nf-stat span{font-size:.57rem;letter-spacing:.03em}
      .nf-stat strong{font-size:1.27rem}
      .nf-board{min-height:0;padding:9px 8px 13px}
      .nf-board-top{padding-bottom:8px;font-size:.58rem}
      .nf-board-main{min-height:234px;padding:7px 0;gap:6px}
      .nmf-dice{gap:5px;min-height:109px;padding:11px 4px 7px}
      .nmf-die{width:61px;height:78px;flex-basis:61px;border-radius:11px;padding:3px}
      .die-core{width:50px;height:49px}
      .nmf-die .die-face{font-size:1.78rem}
      .nmf-die small{font-size:.48rem;max-width:56px}
      .nmf-die .die-corner{font-size:.5rem}
      .nf-board-message{font-size:.71rem}
      .nf-buttons .btn{min-height:40px;padding:10px 16px;font-size:.78rem}
      .nf-details{margin-top:8px}
      .mystery-cinematic{min-height:245px}
      .magic-field{height:170px}
      .nf-mystery.revealed{min-height:250px;padding:12px 0 5px}
      .mystery-options{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
      .mystery-option{min-height:171px;padding:7px 4px;flex-direction:column;text-align:center;gap:4px}
      .mystery-option b{font-size:.69rem;line-height:1.15}
      .mystery-option small{font-size:.59rem;line-height:1.18;max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
      .mystery-glyph{font-size:1.8rem}
      .mini-tag{font-size:.55rem;padding:4px 6px}
      .nf-rule-steps{grid-template-columns:1fr}
      .nf-rule-steps>div{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:2px 7px}
      .nf-rule-steps p{grid-column:2;margin:0}
      .nf-rule-example{grid-template-columns:1fr;gap:9px;padding:11px}
      .nf-rule-visual{gap:5px}
      .rule-visual-die{width:42px;height:42px;flex-basis:42px}
      .hp-drain-row{grid-template-columns:repeat(2,1fr)}
    }
    @media(prefers-reduced-motion:reduce){.nmf-die.tumbling .die-core,.magic-sigil,.magic-chest,.magic-lid,.magic-spark,.magic-title,.mystery-option,.nf-award-toast{animation:none!important}}


    /* Real pips for standard dice; special dice use clearly labeled faces */
    .nmf-die .die-face .rule-visual-die{width:46px;height:46px;border:0;border-radius:0;flex-basis:46px;background:transparent;box-shadow:none;padding:6px;gap:3px}
    .nmf-die .die-face .rule-visual-die i{width:9px;height:9px}
    .nmf-die .die-face .rule-visual-die i.on{background:#0f5863;box-shadow:inset 0 1px 1px #043c4b}
    @media(max-width:650px){.nmf-die .die-face .rule-visual-die{width:38px;height:38px;flex-basis:38px;padding:5px;gap:2px}.nmf-die .die-face .rule-visual-die i{width:7px;height:7px}}

  
    /* Physically roll the entire die housing, including its border, label and pips. */
    .nmf-die.tumbling{
      animation:whole-die-tumble .86s cubic-bezier(.20,.70,.20,1) both!important;
      transform-origin:50% 55%;
      transform-style:preserve-3d;
      backface-visibility:visible;
      will-change:transform,filter;
      z-index:5;
      pointer-events:none;
    }
    .nmf-die.tumbling:nth-child(2n){animation-name:whole-die-tumble-alt!important}
    .nmf-die.tumbling:nth-child(3n){animation-duration:.93s!important}
    @keyframes whole-die-tumble{
      0%{transform:translate3d(-10px,0,0) rotateX(-20deg) rotateY(-18deg) rotateZ(-24deg) scale(.94);filter:brightness(.92)}
      17%{transform:translate3d(-15px,-16px,0) rotateX(-100deg) rotateY(24deg) rotateZ(-112deg) scale(.99);filter:brightness(1.15)}
      40%{transform:translate3d(13px,-25px,0) rotateX(-205deg) rotateY(55deg) rotateZ(-224deg) scale(.94);filter:brightness(.91)}
      62%{transform:translate3d(18px,-9px,0) rotateX(-310deg) rotateY(18deg) rotateZ(-345deg) scale(1.08);filter:brightness(1.07)}
      77%{transform:translate3d(5px,0,0) rotateX(-355deg) rotateY(-10deg) rotateZ(-366deg) scale(.95);filter:brightness(.98)}
      88%{transform:translate3d(2px,-6px,0) rotateX(-360deg) rotateY(0deg) rotateZ(-358deg) scale(1.02);filter:brightness(1.02)}
      100%{transform:translate3d(0,0,0) rotateX(-360deg) rotateY(0deg) rotateZ(-360deg) scale(1);filter:brightness(1)}
    }
    @keyframes whole-die-tumble-alt{
      0%{transform:translate3d(11px,0,0) rotateX(18deg) rotateY(15deg) rotateZ(21deg) scale(.94);filter:brightness(.95)}
      19%{transform:translate3d(16px,-20px,0) rotateX(108deg) rotateY(-32deg) rotateZ(120deg) scale(.97);filter:brightness(1.15)}
      43%{transform:translate3d(-9px,-28px,0) rotateX(214deg) rotateY(-48deg) rotateZ(243deg) scale(.94);filter:brightness(.89)}
      64%{transform:translate3d(-17px,-8px,0) rotateX(324deg) rotateY(12deg) rotateZ(345deg) scale(1.06);filter:brightness(1.08)}
      78%{transform:translate3d(-4px,0,0) rotateX(363deg) rotateY(0deg) rotateZ(366deg) scale(.94);filter:brightness(1)}
      90%{transform:translate3d(1px,-5px,0) rotateX(358deg) rotateY(0deg) rotateZ(358deg) scale(1.02);filter:brightness(1.03)}
      100%{transform:translate3d(0,0,0) rotateX(360deg) rotateY(0deg) rotateZ(360deg) scale(1);filter:brightness(1)}
    }
    /* Keep the game accessible to players who prefer less motion. */
    @media(prefers-reduced-motion:reduce){.nmf-die.tumbling{animation:none!important;transform:none!important;filter:none!important}}

  </style>

  function log(kind,actor,title,detail){g.seq++;g.events.push({seq:g.seq,round:g.round,kind,actor,title,detail});if(g.events.length>800)g.events.shift();}

  function nextBidder(from){for(let offset=1;offset<=g.players.length;offset++){const id=(from+offset)%g.players.length;if(g.active[id] && id!==g.leader)return id;}return -1;}

  function flippedValue(){return g.flips.reduce((t,c)=>t+(c.zero||c.cancelled?0:c.r),0);}

  function setupView(){return `<div class="page-heading"><div><span class="eyebrow">CARD GAME</span><h1>Race to <span class="accent">15.</span></h1><p>A turn-based auction and card-flipping game.</p></div><a class="btn ghost" href="#rules">Full rulebook ↗</a></div><div class="setup-layout"><section class="surface setup-pane"><span class="tag">SINGLE PLAYER VS. COMPUTERS</span><h2 style="margin-top:20px">Game setup</h2><p>Face computer opponents at a fully simulated card table. Uses two complete shuffled decks and the Race to 15 rules.</p><div class="setup-field"><label>Total players (including you)</label><div class="player-buttons">${[2,3,4,5,6].map(n=>`<button class="player-num ${cfg.count===n?'selected':''}" data-action="player-count" data-num="${n}" aria-pressed="${cfg.count===n}">${n}</button>`).join('')}</div></div><button class="btn wide" data-action="new-game">DEAL THE CARDS <span>→</span></button><div class="setup-note">Your first hand starts with 3 cards, plus the opening-round bonus. The dealer (you) opens the first clockwise auction.</div></section><aside class="surface setup-benefits"><div><span class="eyebrow">RACE TO 15</span><h2 style="font-size:2rem;margin-top:9px">Game rules</h2></div><div class="setup-benefit"><span class="benefit-mark">♠</span><span>Keep your flipped-card total at or below the value of your hand.</span></div><div class="setup-benefit"><span class="benefit-mark">♥</span><span>One suit counts as zero. Aces can erase a flipped card's value.</span></div><div class="setup-benefit"><span class="benefit-mark">♦</span><span>Each successful shorter bid lets you keep up to two flipped cards, growing your hand.</span></div><div class="setup-benefit"><span class="benefit-mark">♣</span><span>Safely complete a bid of <strong style="color:#ffdda0">15 or more flips</strong> in one attempt.</span></div></aside></div>`;}

  function feltView(){return `<section class="felt-wrap" aria-label="Card game table"><div class="felt"><div class="felt-top"><span class="round-pill">ROUND ${g.round}</span><span>${g.phase==='auction'?'BIDDING':g.phase==='suit'?'CHOOSE ZERO SUIT':g.phase==='draft'?'CARD DRAFT':g.phase==='over'?'GAME FINISHED':'REVEALING CARDS'}</span><span class="round-pill">DECK ${g.deck.length} · DISCARD ${g.discard.length}</span></div><div class="felt-center">${feltContents()}<div class="deck-stack" aria-label="Draw pile"><div class="card-back"></div><span>DRAW PILE</span></div></div><div class="turn-controls">${controls()}</div>${g.banner?`<div class="result-banner" role="status" aria-live="polite"><div class="result-box ${g.banner.kind==='bust'?'bad':''}"><div class="result-icon">${g.banner.kind==='bust'?'✕':g.banner.kind==='win'?'♛':'✦'}</div><h2>${escaped(g.banner.title)}</h2><p>${escaped(g.banner.detail)}</p><button class="btn" data-action="dismiss">CONTINUE →</button></div></div>`:''}</div></section>`;}

  function handView(){const hand=g.players[0].hand;return `<section class="surface my-hand"><div class="hand-head"><div><div class="panel-title">YOUR PRIVATE HAND</div><div style="font-size:1.02rem;font-weight:900;margin-top:4px">${hand.length} cards · ${val(hand)} hand value</div></div><div class="table-pill"><span>${aceCount(hand)} ACE${aceCount(hand)===1?'':'S'} IN HAND</span><span>${g.players[0].hailUsed?'HAIL MARY USED':'HAIL MARY READY'}</span></div></div><div class="hand-cards">${hand.length?hand.map(c=>cardHTML(c)).join(''):'<span class="muted">Your hand is empty.</span>'}</div><div class="hand-notice">A = 1 · 2–10 = face value · J = 11 · Q = 12 · K = 13. Your opponents cannot see these cards. Aces in your hand may each cancel one face-up card.</div></section>`;}
  function gameView(){
    if(!g)return setupView();
    return `<div class="game-head"><div class="game-head-left"><div class="game-mark">♠</div><div><div class="game-name">Race to <span class="accent">15</span></div><div class="subline">Two 52-card decks · ${g.players.length} players · First to safely flip 15+ in one bid</div></div></div><div class="game-head-actions"><button class="btn sm ghost" data-action="sound">${audioEnabled?'♪ Sound on':'♪ Sound off'}</button><a class="btn sm ghost" href="#rules">Rulebook ↗</a><button class="btn sm outline" data-action="reset">New game</button></div></div><div class="board-layout">${playerPanel()}${feltView()}${handView()}${sideView()}</div><div class="quick-legend"><span>● Green outline = zero-value card</span><span>● Crossed card = canceled by Ace</span><span>● Only the discard pile is reshuffled when the draw pile runs out</span></div>`;
  }
  function rulesView(){return `<section class="rules-hero"><div><span class="eyebrow">OFFICIAL IN-SITE RULEBOOK</span><h1>Race to <span class="accent">15</span></h1><p style="margin:0">Two standard decks · 2–6 players · 15 or more safe flips in one attempt.</p></div><a class="btn" href="#play">PLAY THE GAME →</a></section><div class="rules-layout"><nav class="surface rules-index" aria-label="Rulebook contents"><div class="panel-title">ON THIS PAGE</div><a href="#rules/rule-objective">01 · How to win</a><a href="#rules/rule-setup">02 · Setup & cards</a><a href="#rules/rule-bidding">03 · Clockwise auction</a><a href="#rules/rule-flipping">04 · Zero suit & flipping</a><a href="#rules/rule-rescues">05 · Aces & Hail Mary</a><a href="#rules/rule-results">06 · Success & bust</a><a href="#rules/rule-deck">07 · Deck management</a><a href="#rules/rule-example">08 · Worked example</a></nav><article class="surface rules-article"><section class="rule-section" id="rule-objective"><span class="eyebrow">01 / OBJECTIVE</span><h2>Safely complete 15+ flips.</h2><p>The first player to <strong>complete a bid of 15 or more flipped cards in a single attempt without busting</strong> wins the entire game immediately. Flips from different rounds never add together.</p><div class="rule-tip">Bidding <strong>15 or more</strong> gives you a chance to win the game: safely complete every flip in your bid. There is no upper bid cap.</div></section>
      <section class="rule-section" id="rule-setup"><span class="eyebrow">02 / PREPARE</span><h2>What you need</h2><p><strong>2 standard 52-card decks</strong>, shuffled together once, for 104 total cards, and <strong>2–6 players</strong>. Make room for a draw pile, discard pile and face-up flips.</p><p>Deal <strong>3 cards</strong> to each player. Before the first auction, every player is tied for fewest cards, so each receives <strong>1 bonus card</strong>. At the beginning of later rounds, give one bonus card to <strong>every player tied for the smallest hand</strong>.</p><div class="rule-cards">${[{r:1,suit:'S'},{r:5,suit:'H'},{r:11,suit:'C'},{r:12,suit:'D'},{r:13,suit:'S'}].map(c=>cardHTML(c)).join('')}</div><p>Card values: <strong>A = 1</strong>, numbers 2–10 = face value, <strong>J = 11</strong>, <strong>Q = 12</strong>, <strong>K = 13</strong>.</p></section>
      <section class="rule-section" id="rule-bidding"><span class="eyebrow">03 / BID</span><h2>Clockwise auction</h2><div class="rule-step"><span class="num">1</span><p>The <strong>dealer starts the first auction</strong>. Each later auction begins with the player <strong>immediately to the left of the previous flipper</strong>.</p></div><div class="rule-step"><span class="num">2</span><p>Going <strong>clockwise, one turn at a time</strong>, a player raises the number of cards they believe they can safely flip, or passes. <strong>Passing removes that player from this auction.</strong></p></div><div class="rule-step"><span class="num">3</span><p>The opening bid can be <strong>1 card</strong>. Each new bid must be strictly higher. Bids can exceed 15. The last remaining bidder wins and must attempt the entire bid.</p></div><div class="rule-tip">This is an orderly, turn-based clockwise auction — not a shout-out/open bidding free-for-all.</div></section>
      <section class="rule-section" id="rule-flipping"><span class="eyebrow">04 / FLIP</span><h2>Name a zero-value suit</h2><p>The auction winner names one suit: <strong>spades, hearts, diamonds, or clubs</strong>. Cards of that suit count as <strong>zero points</strong> when flipped, but they still count as flipped cards toward the bid.</p><p>Now reveal cards face up <strong>one at a time</strong>. Your hand value equals the total values of the cards currently in your hand. Add up the values of revealed cards, excluding any cards of the named suit and any cards canceled by Aces. <strong>Equal to your hand value is safe. Above it is a bust</strong> unless rescued.</p></section>
      <section class="rule-section" id="rule-rescues"><span class="eyebrow">05 / SURVIVE</span><h2>Two ways to rescue a bust</h2><div class="rule-step"><span class="num">A</span><p><strong>Aces:</strong> Every Ace in your hand can cancel the value of <strong>one flipped card of your choice</strong>. That card still counts as a flip. An Ace also contributes <strong>1 point</strong> to your hand value.</p></div><div class="rule-step"><span class="num">✦</span><p><strong>Hail Mary:</strong> <strong>Once per player per game</strong>, after going over the hand value, draw the next card from the draw pile into your hand. Its value increases your hand value. If you are still over, use an available Ace or bust.</p></div></section>
      <section class="rule-section" id="rule-results"><span class="eyebrow">06 / RESOLVE</span><h2>What happens next?</h2><div class="rule-example"><div class="example-tile"><strong>Successful bid below 15</strong><p>Choose <strong>up to 2 flipped cards</strong> to keep (only 1 is available after a one-card bid). Discard your entire old hand, draw an equal number of replacement cards, and then add the kept cards. Your hand grows by the number of cards kept through the next attempt.</p></div><div class="example-tile"><strong>Bust</strong><p>Starting with the opponent on your left, each other player takes <strong>exactly 1</strong> flipped card, going clockwise. You get none. Discard leftover flipped cards. Discard your hand and draw the same number of replacement cards.</p></div></div><p>If fewer flipped cards exist than opponents, later opponents cannot pick. On any successful bid of <strong>15 or more</strong>, the game ends immediately instead of drafting cards.</p></section>
      <section class="rule-section" id="rule-deck"><span class="eyebrow">07 / KEEP THE DECK MOVING</span><h2>Shuffle only when necessary</h2><p>Combine and shuffle both decks <strong>once at the beginning</strong>. Do not reshuffle between rounds. When the draw pile is exhausted, <strong>shuffle only the discard pile</strong> to form a new draw pile. Cards still in hands or being claimed remain out of that shuffle.</p></section>
      <section class="rule-section" id="rule-example"><span class="eyebrow">08 / EXAMPLE</span><h2>Survive a four-card bid</h2><p>Your hand contains a King (13), 7, 5, and Ace (1). Your <strong>hand value is 26</strong>. You name <strong>hearts</strong> as the zero-value suit.</p><div class="rule-cards">${[{r:8,suit:'S'},{r:12,suit:'H',zero:true},{r:11,suit:'C'},{r:9,suit:'D'}].map(c=>cardHTML(c)).join('')}</div><p>Flip an 8♠, Q♥, J♣, and 9♦. Their values total <strong>8 + 0 + 11 + 9 = 28</strong>. That exceeds 26: a bust. But your Ace cancels the 9♦, reducing the counted total to <strong>19</strong>. Now all four flips are safe, and you've completed the bid.</p><div class="rule-tip">Quick reminder: Bonus card → Clockwise bidding → Choose zero suit → Flip → Use Aces / Hail Mary if needed → Keep up to 2 or let opponents take 1 each → Refresh hand → Next auction.</div><a class="btn" href="#play">READY? PLAY RACE TO 15 →</a></section></article></div>`;}

  // No More Fours v1.2 — standalone, offline-playable dice game.

  const NMF_SPECIALS={

    devil:{name:"Devil’s Bargain",faces:[6,6,6,6,6,'negate'],desc:'Five 6s and one ×−1 score face.',count:3,glyph:'−'},

  let nmf=null;

  };
  const launchMysteryMotion=()=>{
    nmfMysteryRevealing=true;
    clearTimeout(nmfMysteryTimer);
    nmfMysteryTimer=setTimeout(()=>{nmfMysteryRevealing=false; if(nmf?.phase==='mystery'&&route==='no-fours')render();},1800);
  };
  const loadNmf=()=>{try{const a=JSON.parse(localStorage.getItem(NMF_SAVE)||'null');if(a&&a.version==='1.2'&&Array.isArray(a.dice)&&Array.isArray(a.pool)&&typeof a.hp==='number')nmf=a;}catch(e){nmf=null;}};
  const saveNmf=()=>{try{if(nmf)localStorage.setItem(NMF_SAVE,JSON.stringify(nmf));else localStorage.removeItem(NMF_SAVE);}catch(e){}};
  const scoresNmf=()=>{try{const a=JSON.parse(localStorage.getItem(NMF_BOARD)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.score==='number').sort((a,b)=>b.score-a.score).slice(0,20):[];}catch(e){return [];}};
  const addScoreNmf=(name)=>{const entry={name:String(name).toUpperCase().replace(/[^A-Z]/g,'').slice(0,3).padEnd(3,'-'),score:Math.round(nmf.score),round:nmf.round,date:new Date().toISOString().slice(0,10)};let list=scoresNmf();list.push(entry);list.sort((a,b)=>b.score-a.score);list=list.slice(0,20);try{localStorage.setItem(NMF_BOARD,JSON.stringify(list));}catch(e){}nmf.submitted=true;saveNmf();};
  const startNmf=()=>{clearTimeout(nmfMotionTimer);clearTimeout(nmfMysteryTimer);nmfRollLocked=false;nmfMysteryRevealing=false;nmfRollingIndices=[];nmfAwardToast='';nmf={version:'1.2',hp:10,score:0,round:1,phase:'ready',pool:[{type:'base',id:'b0'},{type:'base',id:'b1'},{type:'base',id:'b2'},{type:'base',id:'b3'},{type:'base',id:'b4'}],dice:[],rerollsLeft:3,selected:[],bag:Object.entries(NMF_SPECIALS).flatMap(([type,s])=>Array.from({length:s.count},(_,j)=>`${type}-${j}`)),mysteryOptions:[],mysteryQueue:0,submitted:false,lastResult:null,history:[]};saveNmf();render();};
  const dieFaces=(type)=>type==='base'?[1,2,3,4,5,6]:NMF_SPECIALS[type].faces;
  const throwDie=(type)=>{const faces=dieFaces(type);return faces[randint(faces.length)];};
  const nmfRerollBudget=()=>3+nmf.pool.filter(d=>d.type==='troll').length;
  function rollNmf(){if(!nmf||nmf.phase!=='ready')return;nmf.dice=nmf.pool.map(d=>({...d,face:throwDie(d.type)}));nmf.rerollsLeft=nmfRerollBudget();nmf.selected=[];nmf.phase='rolling';nmf.lastResult=null;launchRollMotion(nmf.dice.map((_,i)=>i));saveNmf();render();nmfRollingIndices=[];}

  function toggleNmfDie(index){if(!nmf||nmfRollLocked||nmf.phase!=='rolling'||nmf.rerollsLeft<1||!nmf.dice[index])return;nmf.selected=nmf.selected.includes(index)?nmf.selected.filter(i=>i!==index):[...nmf.selected,index];saveNmf();render();}
  function nmfDrain(round){return Math.pow(2,Math.floor((round-1)/10));}
  function scoreNmfRoll(dice){

  function bankNmf(){

  const faceNmf=(face)=>face==='heal1'?'+1 HP':face==='heal2'?'+2 HP':face==='dip'?'?':face==='double'?'×2':face==='negate'?'×−1':String(face);
  function topScoreRows(limit=10){const list=scoresNmf().slice(0,limit);return list.length?list.map((x,i)=>`<div class="score-line"><span class="score-pos">${String(i+1).padStart(2,'0')}</span><strong>${escaped(x.name)}</strong><span class="score-amount">${x.score.toLocaleString()}</span><span class="score-round">R${x.round}</span></div>`).join(''):'<div class="empty-score">No scores saved yet.</div>';}
  const PIP_POS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};

  function nfView(){
    if(!nmf)return `<div class="page-heading nf-heading"><div><span class="eyebrow">DICE GAME · V1.2</span><h1>No More Fours</h1><p>Five dice. Three rerolls. Ten HP.</p></div><a class="btn sm ghost" href="#no-fours-rules">Rules</a></div><section class="nmf-start surface"><div class="nmf-start-art"><span class="giant-die">⚄</span><span class="giant-die secondary">⚃</span></div><div><h2>Start a run</h2><p>Roll dice, grow your collection, and aim for your highest score.</p><div class="nmf-start-actions"><button class="btn" data-action="nf-new">Start game</button><a class="btn ghost" href="#scores">High scores</a></div></div></section>`;

      <div class="nf-stats" aria-label="Game status"><div class="nf-stat"><span>SCORE</span><strong>${Math.round(nmf.score).toLocaleString()}</strong></div><div class="nf-stat hp-stat"><span><b class="hp-heart" aria-hidden="true">♥</b> HP</span><strong class="${nmf.hp<=3?'danger-txt':''}">${nmf.hp}</strong></div><div class="nf-stat"><span>ROUND</span><strong>${nmf.round}</strong></div><div class="nf-stat"><span>REROLLS</span><strong>${roll?nmf.rerollsLeft:nmfRerollBudget()}</strong></div></div>
      <section class="nf-board surface" aria-label="No More Fours play area"><div class="nf-board-top"><span>${ready?'READY TO ROLL':roll?'SELECT DICE TO REROLL':mystery?'MYSTERY BOX':'GAME COMPLETE'}</span><span>${nmf.pool.length} dice in collection</span></div>
      ${mystery?mysteryView():over?`<div class="nf-over"><span class="eyebrow">RUN COMPLETE</span><h2>${Math.round(nmf.score).toLocaleString()} points</h2><p>Round ${nmf.round} · ${nmf.submitted?'Score saved in this browser.':'Save your score with three initials.'}</p>${nmf.submitted?'':`<form id="nf-highscore-form" class="highscore-entry"><input name="initials" maxlength="3" minlength="3" pattern="[a-zA-Z]{3}" required placeholder="AAA" aria-label="Three letter initials" autocomplete="off" autocapitalize="characters"><button class="btn" type="submit">Save score</button></form>`}<div class="control-row"><button class="btn ghost" data-action="nf-new">Play again</button><a class="btn ghost" href="#scores">High scores</a></div></div>`:
      `<div class="nf-board-main"><div class="nmf-dice" aria-label="Dice. Select dice only when you want to reroll them.">${(roll?nmf.dice:nmf.pool.map(d=>({...d,face:null}))).map((d,i)=>{const spec=NMF_SPECIALS[d.type],selected=nmf.selected.includes(i),tumbling=nmfRollingIndices.includes(i);return `<button class="nmf-die ${d.type==='base'?'base-die':'special-die'} ${selected?'selected':''} ${tumbling?'tumbling':''}" data-action="nf-select" data-index="${i}" ${roll&&nmf.rerollsLeft>0&&!nmfRollLocked?'':'disabled'} aria-pressed="${selected}" aria-label="${escaped(spec?.name||'Standard die')}, ${d.face===null?'not rolled':faceNmf(d.face)}${selected?', selected for reroll':''}" title="${escaped(spec?.name||'Standard die')}"><span class="die-core"><span class="die-face">${d.face===null?'?':d.type==='base'&&typeof d.face==='number'&&d.face>=1&&d.face<=6?ruleDie(d.face):faceNmf(d.face)}</span><span class="die-corner">${spec?.glyph||'•'}</span></span><small>${escaped(spec?.name||'Standard')}</small><span class="selected-check" aria-hidden="true">✓</span></button>`;}).join('')}</div><div class="nf-board-message">${ready?'Roll to begin.':nmfRollLocked?'Rolling…':nmf.rerollsLeft?`${nmf.selected.length} selected · ${nmf.rerollsLeft} rerolls left`:'No rerolls remaining'}</div><div class="nf-buttons">${ready?'<button class="btn" data-action="nf-roll">Roll dice</button>':`<button class="btn ghost" data-action="nf-reroll" ${nmf.selected.length&&nmf.rerollsLeft&&!nmfRollLocked?'':'disabled'}>Reroll selected</button><button class="btn" data-action="nf-bank" ${nmfRollLocked?'disabled':''}>Finish round</button>`}</div></div>`}
      ${nmfAwardToast?`<div class="nf-award-toast" aria-live="polite"><span>✦</span> Added ${escaped(nmfAwardToast)} to your dice</div>`:''}</section>
      <details class="nf-details"><summary>Collection, recent rounds &amp; local high scores <span aria-hidden="true">⌄</span></summary><div class="nf-details-grid"><section class="surface nf-aside"><div class="panel-title">YOUR DICE</div><div class="nf-collection">${nmf.pool.map(d=>`<div><span class="collection-symbol">${NMF_SPECIALS[d.type]?.glyph||'⚄'}</span><span>${escaped(NMF_SPECIALS[d.type]?.name||'Standard die')}</span></div>`).join('')}</div></section><section class="surface nf-aside"><div class="panel-title">LAST ROUNDS</div>${nmf.history.slice(0,5).map(e=>`<div class="nf-history"><span>R${e.round}</span><strong>${e.total>=0?'+':''}${e.total}</strong><span>${e.hp} HP</span></div>`).join('')||'<p>No rounds completed.</p>'}</section><section class="surface nf-aside"><div class="panel-title">HIGH SCORES</div><div class="nf-mini-scores">${topScoreRows(5)}</div><a href="#scores" class="nf-more-scores">See all scores →</a></section></div></details></section>`;
  }
  function nfRulesView(){return `<section class="rules-hero"><div><span class="eyebrow">ILLUSTRATED RULEBOOK · V1.2</span><h1>No More Fours</h1><p>Roll five dice, manage your HP, and build your score.</p></div><a class="btn" href="#no-fours">Play game</a></section><div class="nf-rules-grid"><article class="surface nf-rules"><h2>How a round works</h2><div class="nf-rule-steps"><div><span class="step-index">1</span><strong>Roll</strong><p>Start with 5 standard dice, 10 HP, and 3 rerolls per round.</p></div><div><span class="step-index">2</span><strong>Choose</strong><p>Tap dice to select them. Only selected dice roll when you press Reroll selected.</p></div><div><span class="step-index">3</span><strong>Finish</strong><p>Score the final faces, apply penalties and healing, and lose the round's HP drain.</p></div></div><h2>Illustrated scoring</h2><div class="nf-rule-gallery">
      ${ruleExample([2],'Single','Unmatched dice score their face value.','2 points')}
      ${ruleExample([2,2],'Matching pair','Double the sum: (2 + 2) × 2.','8 points')}
      ${ruleExample([3,3,3],'Matching triple','Triple the sum: (3 + 3 + 3) × 3.','27 points')}
      ${ruleExample([4,4,4,4],'Exactly four alike','Any exactly four matching numbers cause damage.','−3 HP','harm')}
      ${ruleExample([5,5,5,5,5],'Five or more alike','Triple the sum and earn a Mystery Box pick.','75 points + ✦ Mystery Box','prize')}
      </div><p class="nf-rule-footnote">Different number groups score independently. Special dice can add healing, multipliers, penalties, or Mystery Box picks. Negative-number dice subtract points.</p><h2>Health drain</h2><div class="hp-drain-row"><span>Rounds 1–10 <b>♥ −1</b></span><span>11–20 <b>♥ −2</b></span><span>21–30 <b>♥ −4</b></span><span>31–40 <b>♥ −8</b></span></div><p>The drain doubles every 10 rounds. Your run ends when you reach 0 HP.</p><h2>Mystery Box</h2><div class="nf-box-explain"><span class="nf-box-icon" aria-hidden="true">✦</span><p>Five or more matching numbers earn a Mystery Box. Survive rounds 5, 10, 15, and so on for a bonus pick. See 3 special dice, choose 1 to keep for your run, and return the others to the box.</p></div></article><aside class="surface nf-rules"><h2>Special dice</h2>${Object.entries(NMF_SPECIALS).map(([id,s])=>`<div class="special-rule"><span class="special-icon illustrated-special">${s.glyph}</span><div><strong>${escaped(s.name)}</strong><p>${escaped(s.desc)} <small>${s.count} ${s.count===1?'copy':'copies'} available.</small></p></div></div>`).join('')}<p class="nf-local-note">High scores are saved on this device, not shared between players.</p></aside></div>`;}
  function scoresView(){return `<div class="page-heading"><div><span class="eyebrow">NO MORE FOURS · V1.2</span><h1>High <span class="accent">scores</span></h1><p>Saved in this browser on this device.</p></div><a class="btn" href="#no-fours">Play No More Fours</a></div><div class="scores-layout"><section class="surface scores-card"><div class="score-line score-head"><span>RANK</span><strong>INITIALS</strong><span class="score-amount">SCORE</span><span class="score-round">ROUND</span></div>${topScoreRows(20)}</section><aside class="surface score-info"><span class="eyebrow">PERSONAL LEADERBOARD</span><h2>Top 20</h2><p>Your scores are stored locally in your browser. Other players and devices have separate scoreboards.</p><a class="btn ghost" href="#no-fours-rules">Read the rules</a></aside></div>`;}

  function render(){
    clearTimeout(aiTimer);clearTimeout(announcementTimer);
    const view=route==='rules'?rulesView():route==='play'?gameView():route==='no-fours'?nfView():route==='no-fours-rules'?nfRulesView():route==='scores'?scoresView():homeView();
    APP.innerHTML=(route==='home'?'':'<a class="game-back-link" href="#home" aria-label="Back to all games">← All games</a>')+view;
    nmfAwardToast='';
    nav();
    if(g){g.newCardId=null;save();}
    if(route==='play'&&g){
      if(g.banner){announcementTimer=setTimeout(()=>{if(g?.banner){g.banner=null;render();}},g.banner.kind==='win'?4500:1900);}
      else if(g.phase!=='over'&&!myTurn()){aiTimer=setTimeout(()=>{botAction();save();render();},650);}
    }
  }
  function updateRoute(){
    const path=location.hash.toLowerCase().replace('#','').split('/');
    route=['home','play','rules','no-fours','no-fours-rules','scores'].includes(path[0])?path[0]:'home';
    render();
    if(route==='rules' && path[1] && document.getElementById(path[1])) document.getElementById(path[1]).scrollIntoView({behavior:'smooth',block:'start'});
    else window.scrollTo({top:0,behavior:'instant'});
  }
  function handleAction(action,button){
    if(action==='nf-new'){startNmf();return;}
    if(action==='nf-reset'){if(window.confirm('Start a new No More Fours run?'))startNmf();return;}
    if(action==='nf-roll'){rollNmf();return;}
    if(action==='nf-select'){toggleNmfDie(Number(button.dataset.index));return;}
    if(action==='nf-reroll'){rerollNmf();return;}
    if(action==='nf-bank'){bankNmf();return;}
    if(action==='nf-choice'){chooseMysteryNmf(button.dataset.id);return;}
    if(action==='player-count'){cfg.count=Number(button.dataset.num);render();return;}
    if(action==='new-game'||action==='rematch'){newGame();return;}
    if(action==='reset'){if(window.confirm('Start a new game? Your current match will be replaced.')){g=null;save();render();}return;}
    if(action==='sound'){audioEnabled=!audioEnabled;render();return;}
    if(action==='log-filter'){logFilter=button.dataset.filter;render();return;}
    if(!g)return;
    if(action==='dismiss'){g.banner=null;save();render();return;}
    if(action==='skip'&&!myTurn()){fastForward();return;}
    if(g.banner||!myTurn()||g.phase==='over')return;
    if(action==='minus'||action==='plus'){
      const input=document.getElementById('bid-value');
      if(!input)return;
      const n=Math.max(1,g.high+1);
      const old=Number(input.value)||n;
      bidInput=action==='plus'?Math.max(n,old+1):Math.max(n,old-1);
      input.value=String(bidInput);return;
    }
    if(action==='bid'){
      const input=document.getElementById('bid-value');const n=Number(input?.value);
      if(!Number.isSafeInteger(n)||n<Math.max(1,g.high+1)){
        input?.setCustomValidity(`Enter a whole-number bid of at least ${Math.max(1,g.high+1)}.`);
        input?.reportValidity();return;
      }
      input.setCustomValidity('');bid(n);
    }
    else if(action==='pass')pass();
    else if(action==='suit')selectSuit(button.dataset.suit);
    else if(action==='flip')flip();
    else if(action==='ace')cancelCard(Number(button.dataset.index));
    else if(action==='hail')hailMary();
    else if(action==='bust')acceptBust();
    else if(action==='pick')pickCard(Number(button.dataset.index));
    save();render();
  }
  document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button)handleAction(button.dataset.action,button);});
  document.addEventListener('submit',event=>{if(event.target.id!=='nf-highscore-form')return;event.preventDefault();if(!nmf||nmf.phase!=='over'||nmf.submitted)return;const input=event.target.querySelector('input[name=initials]');const initials=(input?.value||'').trim().toUpperCase();if(!/^[A-Z]{3}$/.test(initials)){input?.setCustomValidity('Enter exactly three letters.');input?.reportValidity();return;}addScoreNmf(initials);render();});
  document.addEventListener('input',event=>{if(event.target.name==='initials'){event.target.value=event.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);event.target.setCustomValidity('');}});

  document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target?.id==='bid-value'){event.preventDefault();const b=document.querySelector('[data-action="bid"]');if(b)b.click();}});
  window.addEventListener('hashchange',updateRoute);
  restore();loadNmf();updateRoute();
})();
</script>
</body>
</html>
