<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#home" class="brand" aria-label="The Game Table home"><span class="brand-symbol">♠</span><span>THE GAME TABLE<span class="brand-sub">ORIGINAL CARD GAMES</span></span></a>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="nav-link" data-nav="home" href="#home">Home</a>
        <a class="nav-link" data-nav="play" href="#play">Race to 15</a>
        <a class="nav-link nav-cta" data-nav="rules" href="#rules">Rulebook ↗</a>
      </nav>
    </div>
  </header>
  <main id="app" class="shell"></main>
  <footer class="footer"><b>THE GAME TABLE</b> · Original games · Made for real cards and real rivalries. <span>Play against computer opponents in your browser.</span></footer>
<script>
(() => {
  'use strict';
  const APP = document.getElementById('app');
  const SUITS = ['S','H','D','C'];
  const SYM = {S:'♠',H:'♥',D:'♦',C:'♣'};
  const SUITNAME={S:'Spades',H:'Hearts',D:'Diamonds',C:'Clubs'};
  const BOT_NAMES=['Mina','Rex','Kai','Luna','Ash'];
  const SAVE_KEY='the-game-table-race15-v1';
  const rank = n => ({1:'A',11:'J',12:'Q',13:'K'}[n] || String(n));
  const red = suit => suit==='H'||suit==='D';
  const val = hand => hand.reduce((total,card)=>total+card.r,0);
  const aceCount = hand => hand.filter(card=>card.r===1).length;
  const randint = n => Math.floor(Math.random()*n);
  const shuffle = cards => {const a=[...cards];for(let i=a.length-1;i>0;i--){const j=randint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
  const escaped = t => String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let cfg={count:3};
  let g=null;
  let aiTimer=null;
  let announcementTimer=null;
  let bidInput=2;
  let logFilter='round';
  let route='home';
  let audioEnabled=false;
  let audioContext=null;

  function fx(type){
    if(!audioEnabled)return;
    try{
      audioContext ||= new (window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume();
      const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime;
      oscillator.type=type==='win'?'sine':'triangle';oscillator.frequency.setValueAtTime(type==='bust'?170:type==='win'?620:410,t);
      oscillator.frequency.exponentialRampToValueAtTime(type==='bust'?90:type==='win'?880:240,t+.13);
      gain.gain.setValueAtTime(.045,t);gain.gain.exponentialRampToValueAtTime(.001,t+.19);
      oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t);oscillator.stop(t+.2);
    }catch(_e){}
  }
  function save(){try{if(g)localStorage.setItem(SAVE_KEY,JSON.stringify(g));else localStorage.removeItem(SAVE_KEY);}catch(_e){}}
  function restore(){try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(saved&&saved.version===1&&Array.isArray(saved.players)&&Array.isArray(saved.deck)&&Array.isArray(saved.events)&&saved.players.length>=2&&saved.players.length<=6){g=saved;cfg.count=saved.players.length;bidInput=Math.max(2,(g.high||0)+1);}}catch(_e){g=null;}}
  function log(kind,actor,title,detail){g.seq++;g.events.push({seq:g.seq,round:g.round,kind,actor,title,detail});if(g.events.length>800)g.events.shift();}
  function availableCards(){return g.deck.length+g.discard.length;}
  function draw(){
    if(!g.deck.length && g.discard.length){g.deck=shuffle(g.discard);g.discard=[];log('deck',-1,'Draw pile replenished','Only the discard pile was shuffled. Cards in players’ hands and on the table stayed out.');}
    return g.deck.pop()||null;
  }
  function drawHand(id,number){for(let i=0;i<number;i++){let card=draw();if(card)g.players[id].hand.push(card);}}
  function refreshHand(id){const p=g.players[id],size=p.hand.length;g.discard.push(...p.hand);p.hand=[];drawHand(id,size);}
  function beginRound(first){
    g.round++;
    g.phase='auction';g.turn=first;g.leader=-1;g.high=0;g.active=Array(g.players.length).fill(true);
    g.flipper=-1;g.target=0;g.suit=null;g.flips=[];g.usedAces=0;
    g.draft=[];g.draftType=null;g.pickOrder=[];g.pickIndex=0;g.kept=[];g.newCardId=null;
    const min=Math.min(...g.players.map(p=>p.hand.length));
    const recipients=[];
    g.players.forEach((p,i)=>{if(p.hand.length===min){const c=draw();if(c){p.hand.push(c);recipients.push(p.name);}}});
    log('round',-1,`Round ${g.round} begins`,recipients.length?`${recipients.join(', ')} receive a lowest-hand bonus card${recipients.length===1?'':' each'}.`:'No cards available for bonus draws.');
    bidInput=2;
  }
  function newGame(){
    const full=[];
    for(let deck=0;deck<2;deck++)for(const suit of SUITS)for(let r=1;r<=13;r++)full.push({id:`${deck}-${suit}-${r}`,suit,r});
    g={version:1,deck:shuffle(full),discard:[],players:['You',...BOT_NAMES].slice(0,cfg.count).map(name=>({name,hand:[],hailUsed:false,best:0})),round:0,phase:'',turn:0,leader:-1,high:0,active:[],flipper:-1,target:0,suit:null,flips:[],usedAces:0,draft:[],draftType:null,pickOrder:[],pickIndex:0,kept:[],winner:null,newCardId:null,events:[],seq:0,banner:null};
    for(let j=0;j<3;j++)for(let i=0;i<cfg.count;i++)drawHand(i,1);
    beginRound(0);logFilter='round';save();render();
  }
  function nextBidder(from){for(let offset=1;offset<=g.players.length;offset++){const id=(from+offset)%g.players.length;if(g.active[id] && id!==g.leader)return id;}return -1;}
  function afterBidAction(from){
    const next=nextBidder(from);
    if(next===-1){g.flipper=g.leader;g.target=g.high;g.phase='suit';log('auction',g.flipper,`${g.players[g.flipper].name} wins the auction`,`Bid: ${g.target} cards. The winner must attempt every flip.`);}
    else g.turn=next;
  }
  function bid(n){if(!g||g.phase!=='auction'||!Number.isSafeInteger(n)||n<2||n<=g.high)return;
    const actor=g.turn;g.leader=actor;g.high=n;log('bid',actor,`${g.players[actor].name} bids ${n}`,`The next bid must be at least ${n+1}, or the next player may pass.`);afterBidAction(actor);fx('tap');
  }
  function pass(){if(g.phase!=='auction'||!g.high)return;
    const actor=g.turn;g.active[actor]=false;log('pass',actor,`${g.players[actor].name} passes`,'Out of this auction until the next round.');afterBidAction(actor);
  }
  function selectSuit(s){if(g.phase!=='suit'||!SUITS.includes(s))return;
    g.suit=s;g.phase='flip';log('suit',g.flipper,`${g.players[g.flipper].name} names ${SUITNAME[s]}`,`${SYM[s]} cards count as zero but still count as flips.`);fx('tap');
  }
  function flippedValue(){return g.flips.reduce((t,c)=>t+(c.zero||c.cancelled?0:c.r),0);}
  function handLimit(){return val(g.players[g.flipper].hand);}
  function remainingAces(){return aceCount(g.players[g.flipper].hand)-g.usedAces;}
  function announce(kind,title,detail){g.banner={kind,title,detail};}
  function assess(){
    if(flippedValue()>handLimit()){
      if(g.phase!=='danger')log('danger',g.flipper,'Over the hand limit',`${flippedValue()} points exceed ${handLimit()}. An Ace or unused Hail Mary may rescue the attempt.`);
      g.phase='danger';return;
    }
    if(g.flips.length===g.target){succeed();return;}
    g.phase='flip';
  }
  function flip(){if(g.phase!=='flip')return;
    const card=draw();
    if(!card){g.phase='over';g.winner=-1;log('end',-1,'Cards exhausted','No cards remain in the draw or discard piles.');announce('bust','No cards left','The available decks were exhausted before this bid could finish.');return;}
    g.flips.push({...card,zero:card.suit===g.suit,cancelled:false});g.newCardId=card.id;
    log('flip',g.flipper,`${g.players[g.flipper].name} flips ${rank(card.r)}${SYM[card.suit]}`,`${card.suit===g.suit?'Zero-value suit (+0)':'Adds '+card.r+' points'}. ${g.flips.length} of ${g.target} flipped; total ${flippedValue()}.`);
    fx('flip');assess();
  }
  function cancelCard(index){
    if(!['flip','danger'].includes(g.phase)||remainingAces()<=0)return;
    const c=g.flips[index];if(!c||c.zero||c.cancelled)return;
    c.cancelled=true;g.usedAces++;
    log('ace',g.flipper,`${g.players[g.flipper].name} cancels ${rank(c.r)}${SYM[c.suit]}`,`Ace ${g.usedAces} used; counted total is now ${flippedValue()}.`);fx('tap');assess();
  }
  function hailMary(){
    if(g.phase!=='danger'||g.players[g.flipper].hailUsed)return;
    const card=draw();if(!card)return;
    const p=g.players[g.flipper],previous=handLimit();p.hailUsed=true;p.hand.push(card);
    log('hail',g.flipper,`${p.name} uses Hail Mary`,`Drew ${rank(card.r)}${SYM[card.suit]} into hand. Limit ${previous} → ${handLimit()}. This rescue is spent for the game.`);fx('tap');assess();
  }
  function succeed(){
    const p=g.players[g.flipper];p.best=Math.max(p.best,g.flips.length);
    log('success',g.flipper,`${p.name} survives ${g.flips.length} flips`,`${flippedValue()} counted points against a limit of ${handLimit()}.`);
    if(g.target>=15){g.phase='over';g.winner=g.flipper;log('win',g.flipper,`${p.name} wins Race to 15`,`Completed a ${g.target}-card bid in one attempt.`);announce('win',g.winner===0?'YOU WIN!':`${p.name.toUpperCase()} WINS!`,`${g.target} cards safely flipped in a single attempt.`);fx('win');return;}
    startDraft('success');announce('success','ROUND WON!',`${p.name} survived ${g.target} flips. Choose two revealed cards to grow the hand by two.`);fx('win');
  }
  function acceptBust(){
    if(g.phase!=='danger')return;
    log('bust',g.flipper,`${g.players[g.flipper].name} busts`,`${flippedValue()} exceeds ${handLimit()}. Other players draft clockwise, one card each.`);
    startDraft('bust');announce('bust','BUST!',`${g.players[g.flipper].name} went over the hand limit. Each opponent may claim one revealed card.`);fx('bust');
  }
  function startDraft(type){
    g.phase='draft';g.draftType=type;g.draft=g.flips.map(({id,suit,r})=>({id,suit,r}));g.kept=[];g.pickIndex=0;
    g.pickOrder=type==='success'?[g.flipper,g.flipper]:Array.from({length:g.players.length-1},(_,i)=>(g.flipper+i+1)%g.players.length).slice(0,g.draft.length);
    log('draft',-1,type==='success'?'Winner chooses two cards':'Opponents draft clockwise',type==='success'?'These two cards are kept through the next hand refresh.':'The player left of the flipper chooses first; one card per opponent.');
    if(!g.pickOrder.length)finishDraft();
  }
  function pickCard(index){
    if(g.phase!=='draft'||index<0||index>=g.draft.length)return;
    const actor=g.pickOrder[g.pickIndex],card=g.draft.splice(index,1)[0];
    if(g.draftType==='success')g.kept.push(card);else g.players[actor].hand.push(card);
    log('pick',actor,`${g.players[actor].name} takes ${rank(card.r)}${SYM[card.suit]}`,g.draftType==='success'?'Saved as one of the two bonus cards.':'Kept in hand; this opponent cannot pick another this round.');
    g.pickIndex++;fx('tap');
    if(g.pickIndex>=g.pickOrder.length||!g.draft.length)finishDraft();
  }
  function finishDraft(){
    const id=g.flipper,oldSize=g.players[id].hand.length;
    g.discard.push(...g.draft);g.draft=[];
    refreshHand(id);
    if(g.draftType==='success')g.players[id].hand.push(...g.kept);
    log('refresh',id,`${g.players[id].name} refreshes hand`,`${oldSize} old cards discarded and ${oldSize} replacements drawn.${g.draftType==='success'?' Added the two chosen cards.':' No cards kept by the flipper.'} Hand size: ${g.players[id].hand.length}.`);
    beginRound((id+1)%g.players.length);
  }
  function currentActor(){if(!g)return -1;if(g.phase==='auction')return g.turn;if(g.phase==='draft')return g.pickOrder[g.pickIndex]??-1;if(['suit','flip','danger'].includes(g.phase))return g.flipper;return -1;}
  function myTurn(){return currentActor()===0;}
  function botAction(){
    if(!g||g.banner||g.phase==='over'||myTurn())return;
    const actor=currentActor(),p=g.players[actor];
    if(!p)return;
    if(g.phase==='auction'){
      const strength=val(p.hand),as=aceCount(p.hand);
      const raw=strength/5.2+as*1.15+(p.hailUsed?0:.35);
      const ceiling=Math.max(2,Math.round(raw+Math.random()*2.4-1.15));
      if(g.high===0)bid(2);
      else if(g.high>=ceiling)pass();
      else bid(g.high+1);
    }else if(g.phase==='suit'){
      const suitSizes=SUITS.map(s=>p.hand.filter(c=>c.suit===s).length),low=Math.min(...suitSizes);
      const possibilities=SUITS.filter((s,i)=>suitSizes[i]===low);selectSuit(possibilities[randint(possibilities.length)]);
    }else if(g.phase==='flip')flip();
    else if(g.phase==='danger'){
      const candidates=g.flips.map((c,i)=>({...c,i})).filter(c=>!c.zero&&!c.cancelled).sort((a,b)=>b.r-a.r);
      if(remainingAces()>0 && candidates.length)cancelCard(candidates[0].i);
      else if(!p.hailUsed&&availableCards())hailMary();
      else acceptBust();
    }else if(g.phase==='draft'){
      let best=0,max=-1;
      g.draft.forEach((c,i)=>{const points=(c.r===1?16:c.r)+Math.random()*1.6;if(points>max){max=points;best=i;}});
      pickCard(best);
    }
  }
  function fastForward(){let n=0;while(g&&g.phase!=='over'&&!myTurn()&&n++<2500){g.banner=null;const before=g.seq;botAction();if(g.seq===before)break;}g.banner=null;save();render();}
  function cardHTML(card,opt={}){
    const classes=['playing-card',red(card.suit)?'red':'',card.zero?'zero':'',card.cancelled?'cancelled':'',opt.animate?'just-flipped':''].filter(Boolean).join(' ');
    return `<span class="${classes}" aria-label="${rank(card.r)} of ${SUITNAME[card.suit]}"><span class="face-corner">${rank(card.r)}<small>${SYM[card.suit]}</small></span><span class="face-suit">${SYM[card.suit]}</span><span class="face-corner face-bottom">${rank(card.r)}<small>${SYM[card.suit]}</small></span></span>`;
  }
  function nav(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===route));}
  function homeView(){

  function setupView(){return `<div class="page-heading"><div><span class="eyebrow">THE FEATURED GAME</span><h1>Race to <span class="accent">15.</span></h1><p>Bid boldly. Name a suit. Beat your own hand.</p></div><a class="btn ghost" href="#rules">Full rulebook ↗</a></div><div class="setup-layout"><section class="surface setup-pane"><span class="tag">SINGLE PLAYER VS. COMPUTERS</span><h2 style="margin-top:20px">Take your seat.</h2><p>Face computer opponents at a fully simulated card table. Every game uses two complete shuffled decks and the original Race to 15 rules.</p><div class="setup-field"><label>Total players (including you)</label><div class="player-buttons">${[2,3,4,5,6].map(n=>`<button class="player-num ${cfg.count===n?'selected':''}" data-action="player-count" data-num="${n}" aria-pressed="${cfg.count===n}">${n}</button>`).join('')}</div></div><button class="btn wide" data-action="new-game">DEAL THE CARDS <span>→</span></button><div class="setup-note">Your first hand starts with 3 cards, plus the opening-round bonus. The dealer (you) opens the first clockwise auction.</div></section><aside class="surface setup-benefits"><div><span class="eyebrow">A GAME OF BRAVERY</span><h2 style="font-size:2rem;margin-top:9px">The rules are simple. The choices aren't.</h2></div><div class="setup-benefit"><span class="benefit-mark">♠</span><span>Keep your flipped-card total at or below the value of your hand.</span></div><div class="setup-benefit"><span class="benefit-mark">♥</span><span>One suit counts as zero. Aces can erase a flipped card's value.</span></div><div class="setup-benefit"><span class="benefit-mark">♦</span><span>Each successful shorter bid grows your hand by two cards.</span></div><div class="setup-benefit"><span class="benefit-mark">♣</span><span>Be the first to survive a bid of <strong style="color:#ffdda0">15 or more flips</strong> in one attempt.</span></div></aside></div>`;}
  function playerPanel(){return `<aside class="surface players-panel"><div class="panel-title">AT THE TABLE · ${g.players.length} PLAYERS</div><div class="player-list">${g.players.map((p,i)=>`<div class="player-row ${i===0?'me':''} ${currentActor()===i?'active':''}"><div class="avatar">${i===0?'YOU':escaped(p.name).slice(0,1)}</div><div class="player-detail"><div class="player-name">${escaped(p.name)} ${currentActor()===i?'· TURN':''}</div><div class="player-stats">${p.hand.length} cards · best ${p.best} flips</div><div class="player-stats">${p.hailUsed?'Hail Mary used':'Hail Mary ready'}</div></div><strong class="player-stat-num">${p.hand.length}</strong></div>`).join('')}</div><div class="small-status"><span class="status-dot"></span> Opponent hands stay hidden</div></aside>`;}
  function boardCards(){
    const cards=g.phase==='draft'?g.draft:g.flips;

  function metricView(){

    if(g.phase==='danger')return `<div class="hint">${remainingAces()>0?'Use an Ace beneath a revealed card to cancel it.':'No unused Aces are available.'}</div><div class="control-row">${!g.players[0].hailUsed&&availableCards()?'<button class="btn" data-action="hail">HAIL MARY ✦</button>':''}<button class="btn danger" data-action="bust">ACCEPT BUST</button></div><div class="rule-snippet">Hail Mary: once per game, draw the next card into your hand to increase your limit.</div>`;

  }
  function feltView(){return `<section class="felt-wrap" aria-label="Card game table"><div class="felt"><div class="felt-top"><span class="round-pill">ROUND ${g.round}</span><span>${g.phase==='auction'?'BIDDING':g.phase==='suit'?'CHOOSE ZERO SUIT':g.phase==='draft'?'CARD DRAFT':g.phase==='over'?'GAME FINISHED':'REVEALING CARDS'}</span><span class="round-pill">DECK ${g.deck.length} · DISCARD ${g.discard.length}</span></div><div class="felt-center">${feltContents()}<div class="deck-stack" aria-label="Draw pile"><div class="card-back"></div><span>DRAW PILE</span></div></div><div class="turn-controls">${controls()}</div>${g.banner?`<div class="result-banner" role="status" aria-live="polite"><div class="result-box ${g.banner.kind==='bust'?'bad':''}"><div class="result-icon">${g.banner.kind==='bust'?'✕':g.banner.kind==='win'?'♛':'✦'}</div><h2>${escaped(g.banner.title)}</h2><p>${escaped(g.banner.detail)}</p><button class="btn" data-action="dismiss">CONTINUE →</button></div></div>`:''}</div></section>`;}
  function sideView(){
    const actor=currentActor(),last=g.events[g.events.length-1];
    const phases={auction:['Bidding','Bid higher than the current leader, or pass. The auction goes clockwise.'],suit:['Choose a suit','One suit is worth zero when flipped, but still counts toward the bid.'],flip:['Card reveal','Reveal exactly the number of cards in the winning bid without exceeding your hand limit.'],danger:['Rescue or bust','Your counted flips exceed your hand limit. Decide whether to use an Ace or Hail Mary.'],draft:['Claim cards','The winner keeps two after a safe bid, or opponents each claim one after a bust.'],over:['Game over','A player completed a bid of at least 15 cards without busting.']};

  }
  function handView(){const hand=g.players[0].hand;return `<section class="surface my-hand"><div class="hand-head"><div><div class="panel-title">YOUR PRIVATE HAND</div><div style="font-size:1.02rem;font-weight:900;margin-top:4px">${hand.length} cards · ${val(hand)}-point limit</div></div><div class="table-pill"><span>${aceCount(hand)} ACE${aceCount(hand)===1?'':'S'} IN HAND</span><span>${g.players[0].hailUsed?'HAIL MARY USED':'HAIL MARY READY'}</span></div></div><div class="hand-cards">${hand.length?hand.map(c=>cardHTML(c)).join(''):'<span class="muted">Your hand is empty.</span>'}</div><div class="hand-notice">A = 1 · 2–10 = face value · J = 11 · Q = 12 · K = 13. Your opponents cannot see these cards. Aces in your hand may each cancel one face-up card.</div></section>`;}
  function gameView(){
    if(!g)return setupView();
    return `<div class="game-head"><div class="game-head-left"><div class="game-mark">♠</div><div><div class="game-name">Race to <span class="accent">15</span></div><div class="subline">Two 52-card decks · ${g.players.length} players · First to safely flip 15+ in one bid</div></div></div><div class="game-head-actions"><button class="btn sm ghost" data-action="sound">${audioEnabled?'♪ Sound on':'♪ Sound off'}</button><a class="btn sm ghost" href="#rules">Rulebook ↗</a><button class="btn sm outline" data-action="reset">New game</button></div></div><div class="board-layout">${playerPanel()}${feltView()}${sideView()}</div>${handView()}<div class="quick-legend"><span>● Green outline = zero-value card</span><span>● Crossed card = canceled by Ace</span><span>● Only the discard pile is reshuffled when the draw pile runs out</span></div>`;
  }
  function rulesView(){return `<section class="rules-hero"><div><span class="eyebrow">OFFICIAL IN-SITE RULEBOOK</span><h1>Race to <span class="accent">15</span></h1><p style="margin:0">Two decks. Two to six players. One perfect attempt to win.</p></div><a class="btn" href="#play">PLAY THE GAME →</a></section><div class="rules-layout"><nav class="surface rules-index" aria-label="Rulebook contents"><div class="panel-title">ON THIS PAGE</div><a href="#rules/rule-objective">01 · How to win</a><a href="#rules/rule-setup">02 · Setup & cards</a><a href="#rules/rule-bidding">03 · Clockwise auction</a><a href="#rules/rule-flipping">04 · Zero suit & flipping</a><a href="#rules/rule-rescues">05 · Aces & Hail Mary</a><a href="#rules/rule-results">06 · Success & bust</a><a href="#rules/rule-deck">07 · Deck management</a><a href="#rules/rule-example">08 · Worked example</a></nav><article class="surface rules-article"><section class="rule-section" id="rule-objective"><span class="eyebrow">01 / OBJECTIVE</span><h2>One attempt. Fifteen cards.</h2><p>The first player to <strong>complete a bid of 15 or more flipped cards in a single attempt without busting</strong> wins the entire game immediately. Flips from different rounds never add together.</p><div class="rule-tip">Bidding 16 to beat somebody's 15 is legal — but you must safely flip all <strong>16</strong> cards to win. There is no 15-card bidding ceiling.</div></section>
      <section class="rule-section" id="rule-setup"><span class="eyebrow">02 / PREPARE</span><h2>What you need</h2><p><strong>2 standard 52-card decks</strong>, shuffled together once, for 104 total cards, and <strong>2–6 players</strong>. Make room for a draw pile, discard pile and face-up flips.</p><p>Deal <strong>3 cards</strong> to each player. Before the first auction, every player is tied for fewest cards, so each receives <strong>1 bonus card</strong>. At the beginning of later rounds, give one bonus card to <strong>every player tied for the smallest hand</strong>.</p><div class="rule-cards">${[{r:1,suit:'S'},{r:5,suit:'H'},{r:11,suit:'C'},{r:12,suit:'D'},{r:13,suit:'S'}].map(c=>cardHTML(c)).join('')}</div><p>Card values: <strong>A = 1</strong>, numbers 2–10 = face value, <strong>J = 11</strong>, <strong>Q = 12</strong>, <strong>K = 13</strong>.</p></section>
      <section class="rule-section" id="rule-bidding"><span class="eyebrow">03 / BID</span><h2>Clockwise auction</h2><div class="rule-step"><span class="num">1</span><p>The <strong>dealer starts the first auction</strong>. Each later auction begins with the player <strong>immediately to the left of the previous flipper</strong>.</p></div><div class="rule-step"><span class="num">2</span><p>Going <strong>clockwise, one turn at a time</strong>, a player raises the number of cards they believe they can safely flip, or passes. <strong>Passing removes that player from this auction.</strong></p></div><div class="rule-step"><span class="num">3</span><p>The minimum bid is <strong>2 cards</strong>. Each new bid must be strictly higher. Bids can exceed 15. The last remaining bidder wins and must attempt the entire bid.</p></div><div class="rule-tip">This is an orderly, turn-based clockwise auction — not a shout-out/open bidding free-for-all.</div></section>
      <section class="rule-section" id="rule-flipping"><span class="eyebrow">04 / FLIP</span><h2>Name a zero-value suit</h2><p>The auction winner names one suit: <strong>spades, hearts, diamonds, or clubs</strong>. Cards of that suit count as <strong>zero points</strong> when flipped, but they still count as flipped cards toward the bid.</p><p>Now reveal cards face up <strong>one at a time</strong>. Your hand limit equals the total values of the cards currently in your hand. Add up the values of revealed cards, excluding any cards of the named suit and any cards canceled by Aces. <strong>Equal to your hand limit is safe. Above it is a bust</strong> unless rescued.</p></section>
      <section class="rule-section" id="rule-rescues"><span class="eyebrow">05 / SURVIVE</span><h2>Two ways to rescue a bust</h2><div class="rule-step"><span class="num">A</span><p><strong>Aces:</strong> Every Ace in your hand can cancel the value of <strong>one flipped card of your choice</strong>. That card still counts as a flip. An Ace also contributes <strong>1 point</strong> to your hand limit.</p></div><div class="rule-step"><span class="num">✦</span><p><strong>Hail Mary:</strong> <strong>Once per player per game</strong>, after going over the limit, draw the next card from the draw pile into your hand. Its value increases your hand limit. If you are still over, use an available Ace or bust.</p></div></section>
      <section class="rule-section" id="rule-results"><span class="eyebrow">06 / RESOLVE</span><h2>What happens next?</h2><div class="rule-example"><div class="example-tile"><strong>Successful bid below 15</strong><p>Choose <strong>exactly 2 flipped cards</strong> to keep. Discard your entire old hand, draw an equal number of replacement cards, and then add the two kept cards. Your hand grows by 2 permanently through the next attempt.</p></div><div class="example-tile"><strong>Bust</strong><p>Starting with the opponent on your left, each other player takes <strong>exactly 1</strong> flipped card, going clockwise. You get none. Discard leftover flipped cards. Discard your hand and draw the same number of replacement cards.</p></div></div><p>If fewer flipped cards exist than opponents, later opponents cannot pick. On any successful bid of <strong>15 or more</strong>, the game ends immediately instead of drafting cards.</p></section>
      <section class="rule-section" id="rule-deck"><span class="eyebrow">07 / KEEP THE DECK MOVING</span><h2>Shuffle only when necessary</h2><p>Combine and shuffle both decks <strong>once at the beginning</strong>. Do not reshuffle between rounds. When the draw pile is exhausted, <strong>shuffle only the discard pile</strong> to form a new draw pile. Cards still in hands or being claimed remain out of that shuffle.</p></section>
      <section class="rule-section" id="rule-example"><span class="eyebrow">08 / EXAMPLE</span><h2>Survive a four-card bid</h2><p>Your hand contains a King (13), 7, 5, and Ace (1). Your <strong>hand limit is 26</strong>. You name <strong>hearts</strong> as the zero-value suit.</p><div class="rule-cards">${[{r:8,suit:'S'},{r:12,suit:'H',zero:true},{r:11,suit:'C'},{r:9,suit:'D'}].map(c=>cardHTML(c)).join('')}</div><p>Flip an 8♠, Q♥, J♣, and 9♦. Their values total <strong>8 + 0 + 11 + 9 = 28</strong>. That exceeds 26: a bust. But your Ace cancels the 9♦, reducing the counted total to <strong>19</strong>. Now all four flips are safe, and you've completed the bid.</p><div class="rule-tip">Quick reminder: Bonus card → Clockwise bidding → Choose zero suit → Flip → Use Aces / Hail Mary if needed → Keep 2 or let opponents take 1 each → Refresh hand → Next auction.</div><a class="btn" href="#play">READY? PLAY RACE TO 15 →</a></section></article></div>`;}

  function render(){
    clearTimeout(aiTimer);clearTimeout(announcementTimer);
    APP.innerHTML=route==='rules'?rulesView():route==='play'?gameView():homeView();
    nav();
    if(g){g.newCardId=null;save();}
    if(route==='play'&&g){
      if(g.banner){announcementTimer=setTimeout(()=>{if(g?.banner){g.banner=null;render();}},g.banner.kind==='win'?4500:1900);}
      else if(g.phase!=='over'&&!myTurn()){aiTimer=setTimeout(()=>{botAction();save();render();},650);}
    }
  }
  function updateRoute(){
    const path=location.hash.toLowerCase().replace('#','').split('/');
    route=['home','play','rules'].includes(path[0])?path[0]:'home';
    render();
    if(route==='rules' && path[1] && document.getElementById(path[1])) document.getElementById(path[1]).scrollIntoView({behavior:'smooth',block:'start'});
    else window.scrollTo({top:0,behavior:'instant'});
  }
  function handleAction(action,button){
    if(action==='player-count'){cfg.count=Number(button.dataset.num);render();return;}
    if(action==='new-game'||action==='rematch'){newGame();return;}
    if(action==='reset'){if(window.confirm('Start a new game? Your current match will be replaced.')){g=null;save();render();}return;}
    if(action==='sound'){audioEnabled=!audioEnabled;render();return;}
    if(action==='log-filter'){logFilter=button.dataset.filter;render();return;}
    if(!g)return;
    if(action==='dismiss'){g.banner=null;save();render();return;}
    if(action==='skip'&&!myTurn()){fastForward();return;}
    if(g.banner||!myTurn()||g.phase==='over')return;
    if(action==='minus'||action==='plus'){
      const input=document.getElementById('bid-value');
      if(!input)return;
      const n=Math.max(2,g.high+1);
      const old=Number(input.value)||n;
      bidInput=action==='plus'?Math.max(n,old+1):Math.max(n,old-1);
      input.value=String(bidInput);return;
    }
    if(action==='bid'){
      const input=document.getElementById('bid-value');const n=Number(input?.value);
      if(!Number.isSafeInteger(n)||n<Math.max(2,g.high+1)){
        input?.setCustomValidity(`Enter a whole-number bid of at least ${Math.max(2,g.high+1)}.`);
        input?.reportValidity();return;
      }
      input.setCustomValidity('');bid(n);
    }
    else if(action==='pass')pass();
    else if(action==='suit')selectSuit(button.dataset.suit);
    else if(action==='flip')flip();
    else if(action==='ace')cancelCard(Number(button.dataset.index));
    else if(action==='hail')hailMary();
    else if(action==='bust')acceptBust();
    else if(action==='pick')pickCard(Number(button.dataset.index));
    save();render();
  }
  document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button)handleAction(button.dataset.action,button);});
  document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target?.id==='bid-value'){event.preventDefault();const b=document.querySelector('[data-action="bid"]');if(b)b.click();}});
  window.addEventListener('hashchange',updateRoute);
  restore();updateRoute();
})();
</script>
</body>
</html>
